[project]
name = "personal-site-mcp"
version = "0.1.0"
description = "Read-only stdio MCP servers for one person's own Bilibili and Xiaohongshu accounts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "mcp>=1.15",
    "playwright>=1.49",
]

[project.scripts]
bili-mcp = "bili_mcp.cli:main"
xhs-mcp = "xhs_mcp.cli:main"
bili-mcp-smoke = "bili_mcp.smoke:main"
xhs-mcp-smoke = "xhs_mcp.smoke:main"

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pytest>=8",
    "pyzbar>=0.1.9",
    "segno>=1.6.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_browser", "src/bili_mcp", "src/xhs_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
